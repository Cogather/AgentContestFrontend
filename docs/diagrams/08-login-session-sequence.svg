<rect x="757.0" y="673" width="166" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="840.0" y="686" text-anchor="middle" class="tiny">writeSessionCookie()</text>
<path d="M 745 725 L 90 725" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow-gray)" stroke-dasharray="5,4"/>
<rect x="317.0" y="703" width="201" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
