<rect x="58" y="759" width="823" height="22" rx="11" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
<text x="68" y="774" class="tiny" fill="#ea580c">Emergency path: /emergency-login -&gt; POST /api/users/emergency-login -&gt; check emergency_login_accounts -&gt; Set-Cookie</text>
<rect x="405" y="345" width="10" height="60" rx="3" fill="#bfdbfe" stroke="none" opacity="0.9"/>
<rect x="740" y="390" width="10" height="340" rx="3" fill="#bbf7d0" stroke="none" opacity="0.9"/>
<rect x="930" y="430" width="10" height="280" rx="3" fill="#fecaca" stroke="none" opacity="0.9"/>
