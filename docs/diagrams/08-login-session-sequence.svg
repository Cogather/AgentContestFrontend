<path d="M 745 690 L 935 690" fill="none" stroke="#dc2626" stroke-width="1.7" marker-end="url(#arrow-red)"/>
<rect x="757.0" y="668" width="166" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="840.0" y="681" text-anchor="middle" class="tiny">writeSessionCookie()</text>
<path d="M 745 730 L 90 730" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow-gray)" stroke-dasharray="5,4"/>
<rect x="317.0" y="708" width="201" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
