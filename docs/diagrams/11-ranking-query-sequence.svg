<line x1="90" y1="128" x2="90" y2="706" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="178" y="82" width="144" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="250" y="110" text-anchor="middle" class="label">Axios</text>
<line x1="250" y1="128" x2="250" y2="706" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
