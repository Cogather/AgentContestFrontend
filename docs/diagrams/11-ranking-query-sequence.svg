<path d="M 430 625 L 790 625" fill="none" stroke="#16a34a" stroke-width="1.7" marker-end="url(#arrow-green)"/>
<rect x="530.5" y="603" width="159" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="610.0" y="616" text-anchor="middle" class="tiny">getUserRank(userId)</text>
<path d="M 430 665 L 90 665" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow-gray)" stroke-dasharray="5,4"/>
<rect x="173.5" y="643" width="173" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="260.0" y="656" text-anchor="middle" class="tiny">personal RankResponse</text>
<rect x="60" y="700" width="1040" height="36" rx="8" fill="#9333ea" fill-opacity="0.035" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="70" y="689" width="627" height="22" rx="11" fill="#ffffff" stroke="#9333ea" stroke-width="1"/>
<text x="80" y="704" class="tiny" fill="#9333ea">Frontend renders 20 rows as two 10-row columns and marks test accounts as Official Demo</text>
