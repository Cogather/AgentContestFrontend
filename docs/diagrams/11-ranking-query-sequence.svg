<path d="M 430 425 L 90 425" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow-gray)" stroke-dasharray="5,4"/>
<rect x="191.0" y="403" width="138" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="260.0" y="416" text-anchor="middle" class="tiny">RankPageResponse</text>
<rect x="48" y="470" width="1120" height="180" rx="8" fill="#dc2626" fill-opacity="0.035" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="58" y="459" width="109" height="22" rx="11" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
<text x="68" y="474" class="tiny" fill="#dc2626">Personal rank</text>
<path d="M 90 505 L 250 505" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
<rect x="101.0" y="483" width="138" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="170.0" y="496" text-anchor="middle" class="tiny">GET /api/rank/me</text>
<path d="M 250 545 L 430 545" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
<rect x="274.5" y="523" width="131" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
