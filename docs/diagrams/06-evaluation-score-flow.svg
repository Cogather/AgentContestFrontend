<text x="995.0" y="362" text-anchor="middle" class="small">title + detail</text>
<text x="995.0" y="377" text-anchor="middle" class="small">1..10</text>
<rect x="110" y="535" width="200" height="64" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#softShadow)"/>
