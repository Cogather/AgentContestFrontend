<path d="M 820 396 L 820 500 L 210 500 L 210 535" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<rect x="461.0" y="480.0" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
<text x="515.0" y="493.0" text-anchor="middle" class="tiny">history API</text>
<path d="M 995 393 L 995 500 L 495 500 L 495 535" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
<rect x="691.0" y="480.0" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
