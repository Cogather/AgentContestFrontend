<path d="M 600 567 L 720 567" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
<rect x="606.0" y="547.0" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
<text x="660.0" y="560.0" text-anchor="middle" class="tiny">render</text>
