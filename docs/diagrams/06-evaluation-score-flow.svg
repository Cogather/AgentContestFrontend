<text x="745" y="360.0" text-anchor="middle" class="label">submissions</text>
<rect x="920" y="315" width="150" height="78" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#softShadow)"/>
