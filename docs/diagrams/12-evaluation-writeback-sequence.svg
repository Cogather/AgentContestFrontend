<path d="M 90 185 L 610 185" fill="none" stroke="#16a34a" stroke-width="1.7" marker-end="url(#arrow-green)"/>
<rect x="245.0" y="163" width="210" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="350.0" y="176" text-anchor="middle" class="tiny">claim UPLOADED -&gt; EVALUATING</text>
<path d="M 90 230 L 255 230" fill="none" stroke="#ea580c" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
<rect x="79.0" y="208" width="187" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="172.5" y="221" text-anchor="middle" class="tiny">run start.sh with tasks</text>
<path d="M 255 275 L 430 275" fill="none" stroke="#ea580c" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
<rect x="287.5" y="253" width="110" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="342.5" y="266" text-anchor="middle" class="tiny">LLM requests</text>
<path d="M 430 320 L 255 320" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow-gray)" stroke-dasharray="5,4"/>
<rect x="252.5" y="298" width="180" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="342.5" y="311" text-anchor="middle" class="tiny">model answers + tokens</text>
<path d="M 255 365 L 90 365" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow-gray)" stroke-dasharray="5,4"/>
<rect x="117.5" y="343" width="110" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="172.5" y="356" text-anchor="middle" class="tiny">task outputs</text>
<path d="M 90 410 L 610 410" fill="none" stroke="#16a34a" stroke-width="1.7" marker-end="url(#arrow-green)"/>
<rect x="245.0" y="388" width="210" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="350.0" y="401" text-anchor="middle" class="tiny">score, score_detail, token_usage</text>
<rect x="48" y="505" width="1125" height="190" rx="8" fill="#9333ea" fill-opacity="0.035" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="58" y="494" width="158" height="22" rx="11" fill="#ffffff" stroke="#9333ea" stroke-width="1"/>
<text x="68" y="509" class="tiny" fill="#9333ea">Frontend detail view</text>
<path d="M 970 540 L 790 540" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
<rect x="800.5" y="518" width="159" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="880.0" y="531" text-anchor="middle" class="tiny">GET /me/submissions</text>
<path d="M 790 585 L 610 585" fill="none" stroke="#16a34a" stroke-width="1.7" marker-end="url(#arrow-green)"/>
<rect x="595.0" y="563" width="210" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="700.0" y="576" text-anchor="middle" class="tiny">submissions + question_details</text>
<path d="M 790 630 L 970 630" fill="none" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow-gray)" stroke-dasharray="5,4"/>
<rect x="807.5" y="608" width="145" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="880.0" y="621" text-anchor="middle" class="tiny">score_detail JSON</text>
<path d="M 970 675 L 1140 675" fill="none" stroke="#9333ea" stroke-width="1.7" marker-end="url(#arrow-purple)"/>
<rect x="972.0" y="653" width="166" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
<text x="1055.0" y="666" text-anchor="middle" class="tiny">merge by question id</text>
<rect x="80" y="725" width="1040" height="36" rx="8" fill="#dc2626" fill-opacity="0.035" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="90" y="714" width="739" height="22" rx="11" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
<text x="100" y="729" class="tiny" fill="#dc2626">Missing or malformed score_detail: frontend keeps the record visible and shows available status/message</text>
</svg>