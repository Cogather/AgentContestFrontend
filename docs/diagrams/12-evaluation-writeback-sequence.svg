<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 800" width="1220" height="800">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
.title { font-size: 24px; font-weight: 700; }
.label { font-size: 14px; font-weight: 650; }
.small { font-size: 11px; fill: #6b7280; }
.tiny { font-size: 10px; fill: #6b7280; }
.entity-header { font-size: 14px; font-weight: 700; }
.field { font-size: 11px; fill: #374151; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
</marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
</marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
</marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
</marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
</marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
</marker>
<filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111827" flood-opacity="0.08"/>
</filter>
</defs>
<rect width="1220" height="800" fill="#ffffff"/>
<text x="40" y="42" class="title">Sequence: Evaluation Writeback &amp; Score Detail Display</text>
<rect x="18" y="82" width="144" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="90" y="110" text-anchor="middle" class="label">Judge</text>
<line x1="90" y1="128" x2="90" y2="726" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="183" y="82" width="144" height="46" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="255" y="110" text-anchor="middle" class="label">Program</text>
<line x1="255" y1="128" x2="255" y2="726" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="358" y="82" width="144" height="46" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="430" y="110" text-anchor="middle" class="label">Model Gateway</text>
<line x1="430" y1="128" x2="430" y2="726" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="538" y="82" width="144" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="610" y="110" text-anchor="middle" class="label">MySQL</text>
<line x1="610" y1="128" x2="610" y2="726" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="718" y="82" width="144" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="790" y="110" text-anchor="middle" class="label">User API</text>
<line x1="790" y1="128" x2="790" y2="726" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="898" y="82" width="144" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="970" y="110" text-anchor="middle" class="label">HistoryPage</text>
<line x1="970" y1="128" x2="970" y2="726" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="1068" y="82" width="144" height="46" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="1140" y="110" text-anchor="middle" class="label">Detail Modal</text>
<line x1="1140" y1="128" x2="1140" y2="726" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="48" y="150" width="1125" height="310" rx="8" fill="#ea580c" fill-opacity="0.035" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="58" y="139" width="109" height="22" rx="11" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
