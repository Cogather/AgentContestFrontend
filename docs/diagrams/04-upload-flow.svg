<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 860" width="1160" height="860">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
.title { font-size: 24px; font-weight: 700; }
.label { font-size: 14px; font-weight: 650; }
.small { font-size: 11px; fill: #6b7280; }
.tiny { font-size: 10px; fill: #6b7280; }
.entity-header { font-size: 14px; font-weight: 700; }
.field { font-size: 11px; fill: #374151; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
</marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
</marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
</marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
</marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
</marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
</marker>
<filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111827" flood-opacity="0.08"/>
</filter>
</defs>
<rect width="1160" height="860" fill="#ffffff"/>
<text x="40" y="42" class="title">Upload Submission Flow</text>
<rect x="120" y="110" width="200" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="220.0" y="137" text-anchor="middle" class="label">User clicks Upload</text>
<text x="220.0" y="157" text-anchor="middle" class="small">Frontend opens modal</text>
<path d="M 138 220 L 320 220 L 302 292 L 120 292 Z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="220" y="248" text-anchor="middle" class="label">Select .zip</text>
<text x="220" y="268" text-anchor="middle" class="small">client extension check</text>
<rect x="120" y="330" width="200" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="220.0" y="357" text-anchor="middle" class="label">POST /api/upload/me</text>
<text x="220.0" y="377" text-anchor="middle" class="small">cookie + write key</text>
<rect x="420" y="110" width="200" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="520.0" y="137" text-anchor="middle" class="label">Require session</text>
<text x="520.0" y="157" text-anchor="middle" class="small">signed cookie -&gt; user</text>
<polygon points="510,220 600,265 510,310 420,265" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="510" y="258" text-anchor="middle" class="label">Validate rules</text>
<text x="510" y="276" text-anchor="middle" class="tiny">contest window / interval</text>
<rect x="420" y="330" width="200" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="520.0" y="357" text-anchor="middle" class="label">Create submission</text>
<text x="520.0" y="377" text-anchor="middle" class="small">status = UPLOADING</text>
<rect x="720" y="110" width="200" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="820.0" y="137" text-anchor="middle" class="label">Save zip</text>
<text x="820.0" y="157" text-anchor="middle" class="small">uploads/user/id.zip</text>
<rect x="720" y="220" width="200" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="820.0" y="247" text-anchor="middle" class="label">Extract validate</text>
<text x="820.0" y="267" text-anchor="middle" class="small">zip-slip / size / start.sh LF</text>
<rect x="720" y="330" width="200" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="820.0" y="357" text-anchor="middle" class="label">Copy package</text>
<text x="820.0" y="377" text-anchor="middle" class="small">programs + mounted targets</text>
<rect x="420" y="460" width="200" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="520.0" y="487" text-anchor="middle" class="label">Mark UPLOADED</text>
<text x="520.0" y="507" text-anchor="middle" class="small">store paths + queueAhead</text>
<rect x="720" y="460" width="200" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="820.0" y="487" text-anchor="middle" class="label">Return success</text>
<text x="820.0" y="507" text-anchor="middle" class="small">frontend check animation</text>
<rect x="120" y="590" width="200" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#softShadow)"/>
<text x="220.0" y="617" text-anchor="middle" class="label">Failure branch</text>
<text x="220.0" y="637" text-anchor="middle" class="small">delete or mark FAILED</text>
<path d="M 220 182 L 220 220" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<path d="M 220 292 L 220 330" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<path d="M 320 366 L 420 146" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<rect x="316.0" y="236.0" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
<text x="370.0" y="249.0" text-anchor="middle" class="tiny">request</text>
<path d="M 510 182 L 510 220" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
<rect x="456.0" y="181.0" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
<text x="510.0" y="194.0" text-anchor="middle" class="tiny">auth ok</text>
<path d="M 510 310 L 510 330" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
<rect x="456.0" y="300.0" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
<text x="510.0" y="313.0" text-anchor="middle" class="tiny">allowed</text>
<path d="M 620 366 L 720 146" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
<rect x="616.0" y="236.0" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
<text x="670.0" y="249.0" text-anchor="middle" class="tiny">package</text>
<path d="M 810 182 L 810 220" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
<path d="M 810 292 L 810 330" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
<path d="M 720 366 L 620 496" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
<rect x="616.0" y="411.0" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
<text x="670.0" y="424.0" text-anchor="middle" class="tiny">paths</text>
<path d="M 620 496 L 720 496" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<rect x="616.0" y="476.0" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
<text x="670.0" y="489.0" text-anchor="middle" class="tiny">response</text>
<path d="M 420 265 L 290 265 L 290 626 L 320 626" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" stroke-dasharray="5,4"/>
<rect x="236.0" y="425.5" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
<text x="290.0" y="438.5" text-anchor="middle" class="tiny">blocked</text>
<path d="M 920 366 L 1000 366 L 1000 670 L 320 670 L 320 626" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" stroke-dasharray="5,4"/>
<rect x="946.0" y="498.0" width="108" height="18" rx="9" fill="#ffffff" opacity="0.94"/>
<text x="1000.0" y="511.0" text-anchor="middle" class="tiny">copy/zip error</text>
<g transform="translate(55,760)">
<line x1="0" y1="8" x2="30" y2="8" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
<text x="38" y="12" class="small">HTTP / UI progression</text>
<line x1="0" y1="28" x2="30" y2="28" stroke="#dc2626" stroke-width="1.7" marker-end="url(#arrow-red)" stroke-dasharray="5,4"/>
<text x="38" y="32" class="small">rejection or failure</text>
<line x1="0" y1="48" x2="30" y2="48" stroke="#16a34a" stroke-width="1.7" marker-end="url(#arrow-green)"/>
<text x="38" y="52" class="small">database status update</text>
<line x1="0" y1="68" x2="30" y2="68" stroke="#9333ea" stroke-width="1.7" marker-end="url(#arrow-purple)"/>
<text x="38" y="72" class="small">file validation/distribution</text>
</g>
</svg>