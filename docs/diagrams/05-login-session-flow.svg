.small { font-size: 11px; fill: #6b7280; }
.tiny { font-size: 10px; fill: #6b7280; }
.entity-header { font-size: 14px; font-weight: 700; }
.field { font-size: 11px; fill: #374151; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
